name: build-1300d
on:
  workflow_dispatch:
  push:
    branches: ["branches/1300D"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 python3-docutils zip git mercurial pkg-config

      - name: Build 1300D.120
        run: |
          cd platform/1300D.120
          make clean || true
          make -j"$(nproc)" zip || make -j"$(nproc)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find platform/1300D.120 -maxdepth 2 \( -name 'autoexec.bin' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-1300D-120
          path: out/

