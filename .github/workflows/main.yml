name: build-1300d
on:
  workflow_dispatch:
  push:
    branches: ["branches/1300D"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make python3 python3-docutils zip git mercurial pkg-config

      - name: Compiler wrapper (-fcommon for old ML code)
        run: |
          mkdir -p "$HOME/wrap"
          printf '#!/bin/sh\nexec /usr/bin/arm-none-eabi-gcc -fcommon -Wno-error "$@"\n' > "$HOME/wrap/arm-none-eabi-gcc"
          chmod +x "$HOME/wrap/arm-none-eabi-gcc"

      - name: Build zip package
        run: |
          export PATH="$HOME/wrap:$PATH"
          cd platform/1300D.120
          make clean || true
          make SHELL=/bin/bash INSTALL_ALL_SCRIPTS=true -j"$(nproc)" zip 2>&1 | tee /tmp/zip.log | tail -n 40

      - name: Add Lua scripts and modules by hand
        if: always()
        run: |
          mkdir -p platform/1300D.120/zip/ML/scripts
          cp -r scripts/. platform/1300D.120/zip/ML/scripts/ || true
          mkdir -p platform/1300D.120/zip/ML/modules platform/1300D.120/zip/ML/settings platform/1300D.120/zip/ML/logs
          find modules -name '*.mo' -exec cp {} platform/1300D.120/zip/ML/modules/ \; || true

      - name: Build installer (ML-SETUP.FIR)
        continue-on-error: true
        run: |
          export PATH="$HOME/wrap:$PATH"
          cd installer/1300D.120
          make clean || true
          make SHELL=/bin/bash installer 2>&1 | tee /tmp/installer.log | tail -n 60
          ls -la

      - name: Show result
        if: always()
        run: |
          echo "=== installer tail ==="; tail -n 40 /tmp/installer.log || true
          echo "=== fir files in installer/1300D.120 ==="; ls -la installer/1300D.120 | grep -i fir || true
          echo "=== zip dir ==="; find platform/1300D.120/zip -maxdepth 3 | head -n 120 || true

      - name: Pack release
        if: always()
        run: |
          mkdir -p out
          cd platform/1300D.120/zip
          zip -r ../../../out/ML-1300D-120.zip . || true
          cd ../../..
          find installer/1300D.120 -maxdepth 1 -iname '*.fir' -exec cp {} out/ \; || true
          cp platform/1300D.120/zip/autoexec.bin out/ 2>/dev/null || true
          cp /tmp/zip.log /tmp/installer.log out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-1300D-120
          path: out/
